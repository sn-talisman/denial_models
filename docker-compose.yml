version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: healthcare-denial-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Note: PostgreSQL is expected to be running externally on localhost:5432
  # The application connects to it directly, not through Docker

volumes:
  ollama_data:

