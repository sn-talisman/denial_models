[project]
name = "healthcare-denial-management"
version = "0.1.0"
description = "Intelligent Healthcare Denial Management Platform with ML-based denial prediction and root cause analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Healthcare Denial Management Team"}
]

dependencies = [
    # Data & ML
    "pandas>=2.1",
    "numpy>=1.25",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.1",
    "shap>=0.43",
    "optuna>=3.4",
    
    # Data validation
    "pandera>=0.17",
    "pydantic>=2.5",
    
    # API
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "httpx>=0.25",
    
    # Database
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.12",
    "greenlet>=3.0",  # Required for SQLAlchemy async
    
    # Local LLM
    "ollama>=0.1",
    
    # Analytics
    "scipy>=1.11",
    "mlxtend>=0.23",
    
    # Utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "structlog>=23.2",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "black>=23.11",
    "ipython>=8.18",
    "jupyter>=1.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

