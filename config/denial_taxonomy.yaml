    carc_codes: [22, 23, 24, 25, 26]
    keywords: ["other insurance", "COB", "primary payer", "coordination"]

  contractual:
    description: "Contractual or fee schedule adjustments"
    carc_codes: [45, 94, 237, 238, 242]
    keywords: ["contractual", "fee schedule", "allowed amount", "non-participating"]

  other:
