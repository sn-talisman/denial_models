taxonomy_version: "1.0"
categories:
  eligibility_coverage:
    description: "Patient eligibility or coverage issues"
    carc_codes: [1, 2, 3, 27, 29, 31, 32, 33, 38, 96, 181, 197, 198, 199, 200]
    keywords: ["eligibility", "coverage", "not covered", "inactive", "terminated"]
    
  authorization:
    description: "Prior authorization or referral issues"
    carc_codes: [15, 38, 55, 56, 60, 76, 243, 244]
    keywords: ["authorization", "prior auth", "referral", "precertification"]
    
  coding_errors:
    description: "Invalid, incorrect, or mismatched coding"
    carc_codes: [4, 5, 6, 11, 16, 18, 50, 51, 52, 53, 58, 146, 147, 148, 149, 150, 151, 152]
    keywords: ["invalid code", "coding", "modifier", "mismatch", "inconsistent"]
    
